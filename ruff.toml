# Ruff configuration

[lint]
# Pin the rule set explicitly. Ruff 0.16 replaced its implicit defaults with a
# much broader selection (isort, pyupgrade, bandit, flake8-bugbear and more),
# which silently changes what CI enforces on every ruff release. These four
# groups are the defaults this repository was written and reviewed against:
# E4 (imports), E7/E9 (statement and syntax errors) and F (pyflakes).
select = ["E4", "E7", "E9", "F"]
extend-ignore = ["F403", "F405"]
